wallens_driver:
  ros__parameters:
    port: /dev/dynamixel
    baudrate: 57600
    loop_hz: 30.0

    id_left: 2
    id_right: 4
    sign_left: 1                # ruedas enfrentadas: la derecha gira con signo contrario para avanzar
    sign_right: -1
    k_left: 1.0019              # corrección de velocidad de la rueda izquierda (6 corridas en el aire)

    wheel_radius: 0.03625       # m (diámetro 72.5 mm)
    wheel_separation: 0.271     # m efectivos: 238 mm medidos × 1.139 (giro de 360° con el IMU); las ruedas patinan al girar en el sitio

    max_linear: 0.15            # m/s
    max_angular: 1.0            # rad/s
    max_wheel_rpm: 60.0         # tope por rueda; si se pasa, se escalan las dos (la curva se conserva)
    cmd_timeout: 0.25           # s sin /cmd_vel_safe para frenar (el freno republica a 30 Hz, así que no hay huecos)
    battery_timeout: 2.0        # s sin /battery_state (wallens_power) para frenar; <= 0 lo desactiva (solo para el banco sin INA226)
    profile_acceleration: 20    # rampa del motor (214.577 rev/min² por unidad), ~0.5 s hasta 40 rpm
    bus_watchdog: 10            # 20 ms por unidad: 200 ms sin comunicación detiene el motor

    voltage_min: 10.0           # V, rango del XM430-W210
    voltage_max: 14.8
    temp_max: 55                # °C
    max_failures: 5             # ciclos seguidos sin comunicación antes de apagar el nodo
    max_watchdog_trips: 3       # disparos del watchdog del bus en 60 s antes de apagar el nodo (cada uno se rearma solo)

    odom_frame: odom
    base_frame: base_link
    publish_tf: false           # lo publica el EKF (config/ekf.yaml) fusionando el IMU

    brazo_habilitado: false     # true: servicio brazo/transaccion para el tornillo (ID 3) y el gripper (ID 5); ver docs/brazo-bus-plan.md
    brazo_max_ms: 12.0          # ms de bus máximos del brazo por llamada y por ciclo (sobran ~13 ms de los 33 a 57600 baudios)
