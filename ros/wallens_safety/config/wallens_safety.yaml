freno_lidar:
  ros__parameters:
    # Huella del robot sobre base_link (medida 2026-11-01): chasis redondo de 296 mm centrado en el eje de las ruedas y el
    # gripper detrás, sobresale 133 mm y mide ~30 mm de ancho (se usan 50 mm). Con chassis_radius 0 vuelve al cono desde el
    # LiDAR (half_angle_deg) y el giro no se frena. La misma huella está en nav2.yaml de wallens_nav.
    chassis_radius: 0.148       # m
    gripper_length: 0.133       # m que sobresale el gripper por detrás del círculo (llega a 0.281 m de base_link)
    gripper_half_width: 0.025   # m, mitad del ancho del gripper (30 mm medidos + margen)
    laser_x: 0.108              # m, LiDAR delante de base_link (TF de lidar.launch.py)
    lateral_margin: 0.03        # m extra a cada lado del pasillo vigilado
    turn_margin: 0.03           # m de margen alrededor de la huella al simular el giro
    turn_horizon: 0.5           # s de giro simulados (a 0.5 rad/s, ~14°)
    turn_hold: 1.0              # s que el giro sigue frenado tras el último scan que vio el choque (puntos de refilón)
    stop_distance: 0.15         # m desde el borde de la huella (con huella) o desde el LiDAR (sin ella)
    hysteresis: 0.05            # m extra para soltar el freno (frena a 0.15, suelta a 0.20); también el margen del giro
    half_angle_deg: 40.0        # semiancho del cono (sin huella) y del sector que detecta el LiDAR tapado
    laser_yaw_deg: -90.0        # yaw de base_laser respecto a base_link (el cero del LiDAR apunta a la izquierda)
    min_range: 0.06             # m; lecturas más cortas se ignoran (ruido, reflejos del chasis)
    scan_timeout: 0.3           # s sin /scan (3 vueltas del LD19 perdidas): se bloquea el avance (no se sabe si hay obstáculo)
    min_valid_readings: 10      # lecturas válidas mínimas en el sector; con menos (LiDAR tapado) se bloquea el avance
    require_scan: true          # false deja avanzar sin LiDAR (solo para pruebas)
    cmd_timeout: 0.25           # s sin /cmd_vel: no se republica nada (el driver frena solo); Nav2 y los scripts publican a >= 10 Hz
