bno055:
  ros__parameters:
    ros_topic_prefix: "bno055/"
    connection_type: "i2c"
    i2c_bus: 1
    i2c_addr: 0x28
    data_query_frequency: 50
    calib_status_frequency: 0.1
    frame_id: "imu_link"
    operation_mode: 0x08        # IMUPLUS: acelerómetro + giroscopio, sin magnetómetro (yaw relativo estable para validar giros)
                                # NDOF = 0x0C añade el magnetómetro (norte absoluto, pero los motores lo perturban)
    placement_axis_remap: "P1"
    acc_factor: 100.0
    mag_factor: 16000000.0
    gyr_factor: 900.0
    grav_factor: 100.0
    set_offsets: false
