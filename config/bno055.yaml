bno055:
  ros__parameters:
    ros_topic_prefix: "bno055/"
    connection_type: "i2c"
    i2c_bus: 1
    i2c_addr: 0x28
    data_query_frequency: 30    # el EKF corre a 30 Hz; a 50 el bus I2C por software dejaba el nodo al 85 % de CPU y el EKF no cumplía su ritmo
    calib_status_frequency: 0.1
    frame_id: "imu_link"
    operation_mode: 0x08        # IMUPLUS: acelerómetro + giroscopio, sin magnetómetro (yaw relativo estable para validar giros)
                                # NDOF = 0x0C añade el magnetómetro (norte absoluto, pero los motores lo perturban)
    placement_axis_remap: "P6"  # IMU boca abajo: x chip = -y robot, y chip = -x robot, z chip = -z (medido con imu-ejes.py); con esto imu_link coincide con base_link
    acc_factor: 100.0
    mag_factor: 16000000.0
    gyr_factor: 900.0
    grav_factor: 100.0
    set_offsets: false
